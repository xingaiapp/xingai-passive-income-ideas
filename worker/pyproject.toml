[project]
name = "xingai-passive-income-ideas"
version = "0.2.3"
description = "XingAI Daily Passive Income Idea 智报 (report worker)"
requires-python = ">=3.11"
dependencies = [
  "reportlab>=4.2",
  "pypdf>=5.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
passive-income-ideas = "passive_income_ideas.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
