        s_irs: "세무 개요 페이지 존재; 이 Idea 수입 예측 아님"
        s_sba: "공개 창업 가이드; 수요 증명 아님"
        s_azure_waf: "공개 운영 점검 프레임; 맥락용, 수입 예측 아님"
        s_bls: "이 Idea와 직접 인과 未核实"

