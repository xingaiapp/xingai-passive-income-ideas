# UI translations for idea_catalog.yaml (root catalog fields remain 简体中文 for PDF/email).
# Keys under each idea_id: en / ko — same field names as the catalog.

version: 1
ideas:
  ops-checklist-sub:
    en:
      idea_name: "Vertical AI ops checklist (subscription)"
      one_liner: "Productize cloud/.NET/ops checklists into a small-team subscription list + reminders — not a generic ChatGPT shell."
      income_band: "Business revenue (not investment return) estimate: about $0–2,000/mo in 90 days after validation (未核实; no paid validation yet)"
      startup_capital: "Startup capital about $0–500 (domain, email, basic hosting); no fundraising required"
      time_per_week: "Validation: 4–6 hours/week; stop if there is no paid intent"
      first_revenue_eta: "If paid intent appears in 10 interviews, first revenue possible in 2–4 weeks (pre-sale/pilot, 未核实)"
      scalability: "Medium: expand from one vertical to adjacent industries; reminders can be productized"
      do_today: "30 min: list 5 engineering leads; book 3 for 15-minute interviews (ask only: which checks still live in sheets/chat?)"
      dont_today: "Don’t buy ads, don’t build a full SaaS first, don’t set up complex company structures"
      biggest_risk: "Polite interest ≠ willingness to pay; if 10 interviews yield zero paid intent, stop and switch Ideas"
      stop_rules:
        - "10 target-user interviews with no clear paid intent"
        - "Needs 3+ months full-time to reach a sellable minimum"
        - "Depends on unverifiable traffic/revenue promise channels"
      day7_plan:
        - "D1: Book 3 interviews and finalize the question list"
        - "D2–D3: Complete at least 5 interviews; log pain frequency"
        - "D4: Draft a one-page value prop (who, pain, price anchor)"
        - "D5: Produce one deliverable checklist sample"
        - "D6: Show the sample to 2 interviewees; ask about $29–$99/mo pilot"
        - "D7: Write go/no-go"
      day30_goals:
        - "At least 15 interview notes"
        - "One reusable checklist template"
        - "At least one paid pilot or written pre-order intent"
      business_model: "Subscription business revenue: base checklist $29/mo, team $99/mo. Not dividends or investment yield."
      competition: "Generic PM tools and ChatGPT workflows are substitutes; differentiation is vertical checks + accountability — not a blank AI chat box."
      market_evidence:
        - kind: inference
          text: "Small teams still often run release/ops checks in sheets/chat (career experience inference, not a formal survey)."
          source_ids: []
        - kind: fact
          text: "U.S. self-employed people need to understand self-employment tax obligations (IRS page exists)."
          source_ids: [s_irs]
        - kind: fact
          text: "U.S. SBA publishes a public start-a-business guide (page exists; not a demand statistic for this Idea)."
          source_ids: [s_sba]
        - kind: fact
          text: "Azure Well-Architected publishes reliability check frameworks (public docs exist; shows checklist content has mature references — not paid demand)."
          source_ids: [s_azure_waf]
        - kind: recommendation
          text: "Sell the checklist + reminders first; software later. Validate price with pre-sales."
          source_ids: []
      source_notes:
        s_irs: "Tax overview page exists; not an income forecast for this Idea"
        s_sba: "Public start-business guide; not proof of market demand"
        s_azure_waf: "Public ops checklist framework; competitive/context only, not an income forecast"
        s_bls: "未核实 direct causal link to this Idea"
    ko:
      idea_name: "수직 산업 AI 운영 체크리스트(구독)"
      one_liner: "클라우드/.NET/운영 점검 항목을 소규모 팀이 구독할 수 있는 체크리스트+알림으로 제품화 — 범용 ChatGPT 껍데기가 아님."
      income_band: "사업 매출(투자 수익 아님) 추정: 검증 후 90일 약 $0–2,000/월 (未核实; 유료 검증 없음)"
      startup_capital: "시작 자본 약 $0–500(도메인·이메일·기본 호스팅); 투자 유치 불필요"
      time_per_week: "검증기 주 4–6시간; 유료 의도 없으면 중단"
      first_revenue_eta: "인터뷰 10회 중 유료 의도가 있으면 2–4주 내 첫 매출 가능(사전판매/파일럿, 未核实)"
      scalability: "중: 한 수직에서 인접 산업으로 확장 가능; 알림은 제품화 가능"
      do_today: "30분: 엔지니어링 리드 5명 목록 → 3명과 15분 인터뷰(질문: 어떤 점검이 여전히 표/채팅인가?)"
      dont_today: "광고 구매·풀 SaaS 선구축·복잡한 회사 구조는 하지 말 것"
      biggest_risk: "예의 바른 관심 ≠ 지불 의사; 인터뷰 10회 유료 의도 0이면 중단하고 Idea 교체"
      stop_rules:
        - "타깃 유저 인터뷰 10회에도 명확한 유료 의도 없음"
        - "판매 가능한 최소 버전까지 풀타임 3개월 이상 필요"
        - "검증 불가한 트래픽/수익 약속 채널에 의존"
      day7_plan:
        - "D1: 인터뷰 3건 예약 + 질문 목록"
        - "D2–D3: 인터뷰 5회 이상 + 고통 빈도 기록"
        - "D4: 1페이지 가치제안(누구·고통·가격 앵커)"
        - "D5: 납품 가능한 체크리스트 샘플 1개"
        - "D6: 인터뷰 2명에게 샘플 보여주고 $29–$99/월 파일럿 의사 확인"
        - "D7: go/no-go 작성"
      day30_goals:
        - "인터뷰 기록 15건 이상"
        - "재사용 가능한 체크리스트 템플릿 1개"
        - "유료 파일럿 또는 서면 사전구매 의도 1건 이상"
      business_model: "구독 사업 매출: 기본 $29/월, 팀 $99/월. 배당·투자 수익률이 아님."
      competition: "범용 PM·ChatGPT 워크플로가 대체재; 차별점은 수직 점검+책임 경계."
      market_evidence:
        - kind: inference
          text: "소규모 팀은 여전히 표/채팅으로 배포·운영 점검을 하는 경우가 많음(경력 추론, 공식 설문 아님)."
          source_ids: []
        - kind: fact
          text: "미국 자영업자는 self-employment tax 의무를 이해해야 함(IRS 페이지 존재)."
          source_ids: [s_irs]
        - kind: fact
          text: "미국 SBA가 창업 공개 가이드를 제공(페이지 존재; 이 Idea 수요 통계 아님)."
          source_ids: [s_sba]
        - kind: fact
          text: "Azure Well-Architected가 신뢰성 점검 프레임을 공개(문서 존재; 유료 수요 증명 아님)."
          source_ids: [s_azure_waf]
        - kind: recommendation
          text: "먼저 체크리스트+알림을 팔고 소프트웨어는 나중에. 사전판매로 가격 검증."
          source_ids: []
