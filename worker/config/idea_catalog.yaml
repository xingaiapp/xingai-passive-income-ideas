ideas:
  - idea_id: ops-checklist-sub
    idea_name: 垂直行业 AI 运维检查清单（订阅制）
    one_liner: 把云/.NET/运维检查项产品化成小团队可订阅的清单+提醒，而不是通用 ChatGPT 壳。
    skills: [.NET, cloud, AI, eng-management, B2B]
    fit_score: 8
    passive_score: 6
    income_kind: business_revenue
    income_band: "商业收入（非投资收益）估计：验证后 90 天约 $0–2,000/月（未核实；未做付费验证）"
    startup_capital: "启动资金约 $0–500（域名、邮箱、基础托管）；无需融资"
    time_per_week: "验证期每周 4–6 小时；若无人付费意向则停止"
    first_revenue_eta: "若 10 次访谈中出现付费意向，最早 2–4 周可收第一笔（预售/试点，未核实）"
    scalability: "中：可从单一垂直扩展到相邻行业；提醒可产品化"
    do_today: "30 分钟：列出 5 个工程负责人，约其中 3 人做 15 分钟访谈（只问：哪些检查仍靠表格/聊天？）"
    dont_today: "不要买广告、不要先写完整 SaaS、不要注册复杂公司结构"
    biggest_risk: "礼貌兴趣 ≠ 付费意愿；若 10 次访谈零付费意向，立即停止并换题"
    stop_rules:
      - 10 次目标用户访谈仍无明确付费意向
      - 需要全职 3 个月以上才能做出最小可售版本
      - 依赖无法核实的流量/收益承诺渠道
    day7_plan:
      - "D1：完成 3 次访谈预约与问题清单"
      - "D2–D3：完成至少 5 次访谈并记录痛点频率"
      - "D4：起草一页价值主张（谁、什么痛、价格锚点）"
      - "D5：做出 1 份可交付检查清单样例"
      - "D6：向 2 位访谈对象展示样例，问是否愿付 $29–$99/月试点"
      - "D7：写下 go/no-go"
    day30_goals:
      - 至少 15 次访谈记录
      - 1 个可重复交付的清单模板
      - 至少 1 个付费试点或书面预购意向
    automation_path:
      - 周报/提醒邮件自动发送
      - 检查项版本化与客户空间隔离
      - LLM 仅作辅助，不作唯一真理来源
    business_model: "订阅制商业收入：基础清单 $29/月，团队版 $99/月。这不是分红或投资回报率。"
    competition: "通用项目管理与 ChatGPT 工作流是替代品；差异化在垂直检查项与责任边界，而不是空白 AI 对话框。"
    market_evidence:
      - kind: inference
        text: 中小团队仍常用表格/聊天做发布与巡检（基于职业经验推断，非正式调研统计）。
        source_ids: []
      - kind: fact
        text: 美国自雇者需了解 self-employment tax 义务（IRS 页面存在）。
        source_ids: [s_irs]
      - kind: fact
        text: 美国小企业管理局（SBA）提供创办与经营小企业的公开指引入口（页面存在；非对本 Idea 需求量的统计）。
        source_ids: [s_sba]
      - kind: fact
        text: Microsoft Azure Well-Architected 提供运维可靠性检查框架（公开文档存在；说明检查清单类内容有成熟参照物，不证明付费意愿）。
        source_ids: [s_azure_waf]
      - kind: recommendation
        text: 先卖清单与提醒，再考虑软件化；用预售验证价格。
        source_ids: []
    sources:
      s_irs:
